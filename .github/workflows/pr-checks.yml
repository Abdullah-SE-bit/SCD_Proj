# Required checks for dev and main. Job names are locked: see docs/devops/CICDArchitecture.md.
name: pr-checks
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
env:
  PR_BASE: ${{ github.base_ref }}
  PR_HEAD: ${{ github.head_ref }}
  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
  PR_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [repo-structure, requirements-registry, traceability, task-policy, branch-policy, protected-files, secret-scan, harness-tests, lint, typecheck, verdict-unit-tests, backend-unit-tests, ui-component-tests, contract-tests, retrieval-gate, agent-behaviour-tests, docker-build, image-scan, k8s-validate, dependency-security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned Python tools
        run: python -m pip install --disable-pip-version-check -q -r requirements-dev.txt
      - name: Install gitleaks v8.30.1 (checksum verified)
        if: matrix.check == 'secret-scan'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install kubeconform v0.8.0 (checksum verified)
        if: matrix.check == 'k8s-validate'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install actionlint v1.7.12 (checksum verified)
        if: matrix.check == 'repo-structure'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint workflows
        if: matrix.check == 'repo-structure'
        run: actionlint
      - name: Scan git history for secrets
        if: matrix.check == 'secret-scan'
        run: gitleaks git --redact --no-banner --exit-code 1 .
      - name: Judge policy checks with the base branch's checker
        if: contains(fromJSON('["branch-policy","protected-files","task-policy"]'), matrix.check)
        run: |
          if git cat-file -e "origin/$PR_BASE:harness/verification/scd.py" 2>/dev/null; then
            git show "origin/$PR_BASE:harness/verification/scd.py" > "$RUNNER_TEMP/scd.py"
            echo "SCD=$RUNNER_TEMP/scd.py" >> "$GITHUB_ENV"
          fi
      - name: Run check
        env:
          CHECK: ${{ matrix.check }}
        run: python "${SCD:-harness/verification/scd.py}" check "$CHECK"

  ci-gate:
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fail unless every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python harness/verification/scd.py check ci-gate
