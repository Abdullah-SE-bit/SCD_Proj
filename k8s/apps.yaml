# One Deployment and Service per module (K8S-002). Image tag "dev" is replaced with the commit SHA by
# scripts/deploy.sh. Requests and limits are provisional until measured with kubectl top (P10.01).
# scouts runs here for on-demand calls; its schedule arrives with P04.02.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ui, namespace: idea-validator, labels: { app: ui } }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ui
          image: services-ui:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - name: API_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: API_URL } }
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata: { name: ui, namespace: idea-validator, labels: { app: ui } }
spec:
  selector: { app: ui }
  ports: [{ port: 8080, targetPort: 8080 }]
---
