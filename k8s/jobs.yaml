# M6i ingestion on a daily schedule, after the scouts (K8S-003): reads the raw items, fills Postgres and Qdrant.
# Evaluation and model import schedules arrive with their tasks.
apiVersion: batch/v1
kind: CronJob
metadata: { name: ingestion, namespace: idea-validator, labels: { app: ingestion } }
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata: { labels: { app: ingestion } }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: ingestion
              image: jobs-ingestion:dev
              imagePullPolicy: IfNotPresent
              env:
                - { name: POSTGRES_HOST, value: postgres }
                - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_USER } } }
                - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_DB } } }
                - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD } } }
                - { name: VECTOR_STORE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: VECTOR_STORE_URL } } }
                - { name: SCOUT_OUT, value: /data/raw }
                - { name: SNAPSHOT, value: /data/raw/snapshot/cards.jsonl }
              volumeMounts:
                - { name: raw-items, mountPath: /data/raw }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "2", memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
          volumes:
            - { name: raw-items, persistentVolumeClaim: { claimName: raw-items } }
            - { name: tmp, emptyDir: {} }
---
# Raw items written by the scouts and read by the ingestion job (P04.03).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: raw-items, namespace: idea-validator }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
# M4 scouts on a daily schedule (M04-002, K8S-003). Run once by hand with:
#   kubectl -n idea-validator create job --from=cronjob/scouts scouts-now
# The label differs from the scouts Deployment so the Service never routes requests to a job pod.
apiVersion: batch/v1
kind: CronJob
metadata: { name: scouts, namespace: idea-validator, labels: { app: scouts-job } }
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata: { labels: { app: scouts-job } }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: scouts
              image: services-scouts:dev
              imagePullPolicy: IfNotPresent
              command: [python, -m, scd_scouts.run, --limit, "1000", --out, /data/raw]
              volumeMounts: [{ name: raw-items, mountPath: /data/raw }]
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                readOnlyRootFilesystem: true
          volumes: [{ name: raw-items, persistentVolumeClaim: { claimName: raw-items } }]
